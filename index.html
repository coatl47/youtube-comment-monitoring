<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국민연금 이사장 유튜브 여론 모니터링</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --bg: #f3f5f8;
            --surface: #ffffff;
            --surface-soft: #f8fafc;
            --line: #dde4ee;
            --primary: #185abd;
            --primary-soft: #eaf2ff;
            --text: #1f2937;
            --muted: #6b7280;
            --positive: #16a34a;
            --negative: #dc2626;
            --neutral: #94a3b8;
            --other: #a855f7;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top right, #e4eefc, transparent 30%), var(--bg);
            color: var(--text);
            font-family: 'Pretendard', sans-serif;
            padding-bottom: 48px;
        }

        .page-shell {
            max-width: 1380px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .hero {
            padding: 20px 0 12px;
        }

        .hero-panel {
            background: linear-gradient(135deg, #103f87, #1f67d2);
            color: white;
            border-radius: 28px;
            padding: 20px 24px;
            box-shadow: 0 22px 45px rgba(16, 63, 135, 0.18);
        }

        .hero-title {
            font-size: clamp(1.9rem, 3vw, 2.7rem);
            font-weight: 800;
            margin-bottom: 10px;
        }

        .hero-subtitle {
            margin: 0;
            color: rgba(255, 255, 255, 0.84);
            font-size: 1rem;
        }

        .rep-comments {
            margin-top: 18px;
        }

        /* 차트 밖에서 쓰는 안내 문구는 제자리에 표시 */
        .rep-comments .empty-msg,
        .panel-body > .empty-msg {
            position: static;
            padding: 12px 0;
        }

        .rep-category {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid rgba(148, 163, 184, 0.28);
        }

        .rep-category:first-child {
            margin-top: 4px;
            padding-top: 0;
            border-top: 0;
        }

        .rep-category-title {
            font-weight: 800;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .rep-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .rep-column-title {
            font-size: 0.8rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .rep-column-title.positive {
            color: #16A34A;
        }

        .rep-column-title.negative {
            color: #DC2626;
        }

        .rep-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rep-list li {
            font-size: 0.82rem;
            line-height: 1.5;
            background: rgba(148, 163, 184, 0.1);
            border-radius: 10px;
            padding: 9px 12px;
            word-break: break-word;
        }

        .rep-like {
            display: inline-block;
            font-weight: 700;
            color: var(--muted);
            margin-right: 8px;
            white-space: nowrap;
        }

        .rep-icon.positive {
            color: #16A34A;
            font-weight: 900;
        }

        .rep-empty {
            font-size: 0.82rem;
            color: var(--muted);
        }

        @media (max-width: 768px) {
            .rep-columns {
                grid-template-columns: 1fr;
            }
        }

        .nav-wrap {
            margin: 22px 0 24px;
            display: flex;
            align-items: stretch;
            gap: 10px;
        }

        .tab-scroller {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .tab-track {
            display: flex;
            gap: 8px;
            flex: 0 1 auto;
            min-width: 0;
        }

        .dashboard-tab {
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.86);
            border-radius: 16px;
            padding: 8px 16px;
            color: var(--text);
            font-weight: 700;
            transition: all 0.2s ease;
            text-align: left;
        }

        .dashboard-tab.overview-tab {
            flex: 0 0 auto;
            padding: 8px 22px;
            text-align: center;
        }

        .dashboard-tab.video-tab {
            flex: 0 1 210px;
            width: 210px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            line-height: 1.25;
        }

        .tab-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tab-date {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--muted);
        }

        .dashboard-tab:hover {
            background: white;
            border-color: #bfd2f2;
        }

        .dashboard-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 12px 24px rgba(24, 90, 189, 0.22);
        }

        .dashboard-tab.active .tab-date {
            color: rgba(255, 255, 255, 0.8);
        }

        .tab-arrow {
            flex: 0 0 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: white;
            color: var(--primary);
            font-size: 1.35rem;
            font-weight: 800;
            line-height: 1;
            padding: 0 0 3px;
        }

        .tab-arrow:hover:not(:disabled) {
            border-color: #bfd2f2;
            background: var(--primary-soft);
        }

        .tab-arrow:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .compare-panel {
            padding-bottom: 10px;
        }

        .compare-table th,
        .compare-table td {
            white-space: nowrap;
        }

        .compare-table th {
            font-size: 0.8rem;
        }

        .compare-table .num {
            text-align: right;
            white-space: nowrap;
        }

        .compare-table tbody tr {
            cursor: pointer;
        }

        .compare-table tbody tr:hover {
            background: #f8fbff;
        }

        .compare-table td:first-child,
        .compare-table th:first-child {
            padding-left: 1.25rem;
            white-space: nowrap;
            position: sticky;
            left: 0;
            background: var(--surface);
            z-index: 1;
        }

        .compare-table tbody tr:hover td:first-child {
            background: #f8fbff;
        }

        .cell-sub {
            font-size: 0.78rem;
            color: var(--muted);
            font-weight: 500;
        }

        .small-sample {
            font-size: 0.7rem;
            color: #b45309;
            font-weight: 700;
        }

        .sentiment-cell {
            min-width: 170px;
        }

        .mini-bar {
            display: flex;
            height: 10px;
            border-radius: 999px;
            overflow: hidden;
            background: var(--surface-soft);
        }

        .mini-bar.is-faint {
            opacity: 0.4;
        }

        .mini-bar-legend {
            font-size: 0.75rem;
            margin-top: 4px;
            white-space: nowrap;
        }

        .text-positive {
            color: var(--positive);
            font-weight: 700;
        }

        .text-negative {
            color: var(--negative);
            font-weight: 700;
        }

        .heat-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 4px;
            font-size: 0.82rem;
        }

        .heat-table thead th {
            font-weight: 700;
            color: var(--muted);
            text-align: center;
            font-size: 0.75rem;
            padding-bottom: 4px;
        }

        .heat-row-label {
            white-space: nowrap;
            padding-right: 8px;
            font-weight: 700;
        }

        .heat-cell {
            text-align: center;
            border-radius: 10px;
            padding: 8px 4px;
            min-width: 64px;
        }

        .heat-cell.is-empty {
            background: var(--surface-soft);
            color: var(--muted);
        }

        .heat-value {
            font-weight: 800;
            font-size: 0.95rem;
        }

        .heat-count {
            font-size: 0.7rem;
            opacity: 0.8;
        }

        .card-panel {
            background: var(--surface);
            border: 1px solid rgba(221, 228, 238, 0.8);
            border-radius: 24px;
            box-shadow: 0 16px 34px rgba(22, 35, 54, 0.06);
            margin-bottom: 22px;
        }

        .panel-header {
            padding: 20px 24px 0;
        }

        .panel-title {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 800;
        }

        .panel-subtitle {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .panel-body {
            padding: 20px 24px 24px;
        }

        .metric-card {
            background: linear-gradient(180deg, var(--surface), var(--surface-soft));
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 18px;
            height: 100%;
        }

        .metric-label {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.1;
        }

        .metric-footnote {
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .video-summary-card {
            background: linear-gradient(180deg, #ffffff, #f8fbff);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 18px;
            height: 100%;
        }

        .badge-soft {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-soft);
            color: var(--primary);
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .meta-list {
            display: grid;
            gap: 8px;
        }

        .meta-line {
            color: var(--muted);
            font-size: 0.92rem;
        }

        .meta-line strong {
            color: var(--text);
            margin-right: 6px;
        }

        .chart-container {
            height: 400px;
            position: relative;
        }

        .chart-container.short {
            height: 320px;
        }

        .chart-container.category-overview-chart {
            height: 560px;
        }

        .empty-msg {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-style: italic;
        }

        .detail-hero {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
        }

        .detail-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .video-link {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .video-link:hover {
            text-decoration: underline;
        }

        .table-wrap {
            max-height: 620px;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            border-top: 1px solid rgba(221, 228, 238, 0.8);
        }

        .detail-data-table {
            width: 100%;
            table-layout: fixed;
        }

        .detail-data-table td,
        .detail-data-table th {
            vertical-align: top;
        }

        .detail-data-table .col-sentiment {
            width: 108px;
        }

        .detail-data-table .col-category {
            width: 118px;
        }

        .detail-data-table .col-keyword {
            width: 118px;
        }

        .detail-data-table .comment-cell {
            white-space: normal;
            word-break: break-word;
            line-height: 1.45;
        }

        .table thead {
            position: sticky;
            top: 0;
            background: #f8fafc;
            z-index: 1;
        }

        th.sortable {
            cursor: pointer;
            user-select: none;
        }

        th.sortable:hover {
            background: #eef3f9;
        }

        .sort-icon {
            font-size: 0.8rem;
            color: #9aa4b2;
            margin-left: 5px;
        }

        .sentiment-badge {
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 0.84rem;
            font-weight: 700;
            display: inline-block;
            min-width: 60px;
            text-align: center;
        }

        .sentiment-positive {
            background: rgba(0, 204, 150, 0.12);
            color: var(--positive);
        }

        .sentiment-negative {
            background: rgba(239, 85, 59, 0.12);
            color: var(--negative);
        }

        .sentiment-neutral {
            background: rgba(99, 110, 250, 0.12);
            color: var(--neutral);
        }

        .sentiment-other {
            background: rgba(168, 85, 247, 0.12);
            color: var(--other);
        }

        .footer {
            margin-top: 28px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .footer ul {
            padding-left: 18px;
            margin-bottom: 0;
        }

        .d-none {
            display: none !important;
        }

        @media (max-width: 768px) {
            .page-shell {
                padding: 0 12px;
            }

            .hero-panel {
                padding: 14px 16px;
                border-radius: 18px;
            }

            .hero-title {
                font-size: 1.45rem;
                margin-bottom: 6px;
            }

            .hero-subtitle {
                font-size: 0.92rem;
                line-height: 1.5;
            }

            .nav-wrap {
                margin: 16px 0 18px;
                gap: 6px;
            }

            .tab-scroller,
            .tab-track {
                gap: 6px;
            }

            .dashboard-tab.overview-tab {
                padding: 8px 14px;
            }

            .dashboard-tab.video-tab {
                padding: 7px 10px;
                font-size: 0.88rem;
            }

            .tab-arrow {
                flex-basis: 30px;
                height: 30px;
            }

            .heat-table {
                border-spacing: 3px;
                font-size: 0.75rem;
            }

            .heat-cell {
                min-width: 52px;
                padding: 6px 2px;
            }

            .heat-value {
                font-size: 0.85rem;
            }

            .card-panel {
                border-radius: 18px;
                margin-bottom: 16px;
            }

            .panel-header,
            .panel-body {
                padding-left: 14px;
                padding-right: 14px;
            }

            .panel-header {
                padding-top: 16px;
            }

            .panel-title {
                font-size: 1rem;
            }

            .panel-subtitle {
                font-size: 0.86rem;
                line-height: 1.45;
            }

            .metric-card {
                border-radius: 16px;
                padding: 14px;
            }

            .metric-label {
                font-size: 0.82rem;
            }

            .metric-value {
                font-size: 1.28rem;
            }

            .metric-footnote {
                font-size: 0.78rem;
            }

            .summary-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .video-summary-card {
                border-radius: 18px;
                padding: 14px;
            }

            .chart-container {
                height: 250px;
            }

            .chart-container.short {
                height: 220px;
            }

            .chart-container.category-overview-chart {
                height: 760px;
            }

            .detail-title {
                font-size: 1.15rem;
                line-height: 1.45;
            }

            .meta-line {
                font-size: 0.88rem;
            }

            .badge-soft {
                font-size: 0.77rem;
                padding: 5px 9px;
            }

            .table-wrap {
                display: block;
                max-height: 520px;
            }

            .detail-data-table {
                width: 100%;
                table-layout: fixed;
            }

            .detail-data-table td,
            .detail-data-table th {
                font-size: 0.84rem;
                padding: 10px 8px;
            }

            .detail-data-table .col-sentiment {
                width: 70px;
            }

            .detail-data-table .col-category {
                width: 78px;
            }

            .detail-data-table .col-keyword {
                width: 78px;
            }

            .detail-data-table .comment-cell {
                line-height: 1.4;
                white-space: normal;
                word-break: break-word;
            }

            .sentiment-badge {
                min-width: 46px;
                font-size: 0.72rem;
                padding: 4px 6px;
            }

            .detail-data-table .badge {
                font-size: 0.72rem;
                white-space: normal;
            }
        }
    </style>
</head>

<body>
    <div class="page-shell">
        <header class="hero">
            <div class="hero-panel">
                <div class="hero-title" id="dashboardTitle">국민연금 이사장 유튜브 여론 모니터링</div>
            </div>
        </header>

        <nav class="nav-wrap" id="tabsContainer" aria-label="영상 탭"></nav>

        <section id="overviewSection"></section>
        <section id="detailSection" class="d-none"></section>

        <footer class="footer">
            <div class="card-panel">
                <div class="panel-body">
                    <div class="fw-bold text-dark mb-2">면책조항</div>
                    <ul>
                        <li>본 대시보드의 수치는 유튜브 API 수집 시점 기준이며, 실제 서비스 화면과 차이가 있을 수 있습니다.</li>
                        <li>댓글 감성 및 주제 분류 결과는 AI 자동 분석 결과로, 실제 작성자의 의도와 다를 수 있습니다.</li>
                        <li>분석 결과는 참고용이며, 정책 판단이나 대외 커뮤니케이션에는 추가 검토가 필요합니다.</li>
                    </ul>
                </div>
            </div>
        </footer>
    </div>

    <script>
        const configOptions = { responsive: true, displayModeBar: false };
        const colorMap = { '긍정': '#16A34A', '부정': '#DC2626', '중립': '#94A3B8', '오류': '#A855F7' };
        const sentimentOrder = ['긍정', '부정', '중립', '오류'];
        const categoryOrder = ['리밸런싱', '국내주식투자', '기금운용성과', '기관 운영 등 기타'];
        const categoryAliasMap = {
            '리밸런싱': '리밸런싱',
            '매도 폭탄': '리밸런싱',
            '매물 폭탄': '리밸런싱',
            '국내주식투자': '국내주식투자',
            '국내주식': '국내주식투자',
            '국내 주식 투자 비중': '국내주식투자',
            '코스피': '국내주식투자',
            '기금운용성과': '기금운용성과',
            '기금운용': '기금운용성과',
            '운용성과': '기금운용성과',
            '수익률': '기금운용성과',
            '퇴직연금': '기관 운영 등 기타',
            '기금화': '기관 운영 등 기타',
            '기관 운영 등 기타': '기관 운영 등 기타',
            '기관 운영': '기관 운영 등 기타',
            '기타': '기관 운영 등 기타'
        };
        const isMobile = window.innerWidth < 768;
        const chartFontSize = isMobile ? 11 : 12;
        const appState = { config: null, reports: [], bundles: new Map(), activeTab: 'overview', tabOffset: 0 };
        const VISIBLE_VIDEO_TABS = isMobile ? 2 : 5; // 종합 탭(고정) + 영상 탭 5개 = 최대 6개

        function formatNumber(value) {
            const number = Number(value || 0);
            return Number.isFinite(number) ? number.toLocaleString() : '-';
        }

        function formatDateTime(value) {
            return value || '-';
        }

        function formatDateOnly(value) {
            if (!value) return '-';
            const text = String(value).trim();
            return text.length >= 10 ? text.slice(0, 10) : text;
        }

        function formatShortDate(value) {
            const text = formatDateOnly(value);
            return /^\d{4}-\d{2}-\d{2}$/.test(text) ? text.slice(2).replace(/-/g, '.') : text;
        }

        // 등록 순서(dashboard_config.json의 reports 순서)대로 반환합니다.
        function getOrderedBundles() {
            return appState.reports.map(report => appState.bundles.get(report.id)).filter(Boolean);
        }

        function getSentimentClass(sentiment) {
            if (sentiment === '긍정') return 'sentiment-positive';
            if (sentiment === '부정') return 'sentiment-negative';
            if (sentiment === '오류') return 'sentiment-other';
            return 'sentiment-neutral';
        }

        function normalizeSentiment(sentiment) {
            if (sentimentOrder.includes(sentiment)) return sentiment;
            if (sentiment === '광고') return null;
            return '중립';
        }

        function normalizeCategory(category) {
            const value = (category || '').trim();
            return categoryAliasMap[value] || '기관 운영 등 기타';
        }

        function sortCategories(categories) {
            return [...categories].sort((a, b) => {
                const indexA = categoryOrder.indexOf(a);
                const indexB = categoryOrder.indexOf(b);
                const orderA = indexA === -1 ? Number.MAX_SAFE_INTEGER : indexA;
                const orderB = indexB === -1 ? Number.MAX_SAFE_INTEGER : indexB;
                return orderA - orderB || a.localeCompare(b, 'ko');
            });
        }

        function getAxisName(prefix, index) {
            return index === 0 ? prefix : `${prefix}${index + 1}`;
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 화면에 넣는 텍스트는 항상 이스케이프합니다(댓글에 HTML이 섞여 있어도 안전하게 표시).
        function safeText(value) {
            return value ? escapeHtml(value) : '-';
        }

        function prepareChartContainer(containerId) {
            const element = document.getElementById(containerId);
            if (!element) return null;
            element.innerHTML = '';
            return element;
        }

        function createMetricCard(label, value, footnote = '') {
            return `
                <div class="metric-card">
                    <div class="metric-label">${label}</div>
                    <div class="metric-value">${value}</div>
                    <div class="metric-footnote">${footnote || '&nbsp;'}</div>
                </div>
            `;
        }

        function parseCsv(filePath) {
            return new Promise((resolve, reject) => {
                Papa.parse(`${filePath}?v=${Date.now()}`, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: results => resolve(results.data || []),
                    error: error => reject(error)
                });
            });
        }

        function buildStatsSeries(statsRows, report) {
            const rows = statsRows
                .filter(row => row.timestamp)
                .map(row => ({
                    timestamp: row.timestamp,
                    view_count: Number(row.view_count || 0),
                    like_count: Number(row.like_count || 0),
                    comment_count: Number(row.comment_count || 0),
                    title: row.title || report.video_title
                }))
                .sort((a, b) => a.timestamp.localeCompare(b.timestamp));

            if (report.video_start_at) {
                const startRow = {
                    timestamp: report.video_start_at,
                    view_count: 0,
                    like_count: 0,
                    comment_count: 0,
                    title: report.video_title
                };
                if (rows.length === 0 || rows[0].timestamp > report.video_start_at) {
                    rows.unshift(startRow);
                } else if (rows[0].timestamp === report.video_start_at) {
                    rows[0] = { ...startRow, ...rows[0] };
                }
            }

            return rows;
        }

        // 개별 탭은 영상 고유 주제를 그대로 씁니다(빈 값·'기타'만 정리).
        function rawCategory(category) {
            const value = (category || '').trim();
            return !value || value === '기타' ? '기관 운영 등 기타' : value;
        }

        // normalize=true면 공통 4분류(categoryAliasMap)로 맞춥니다(종합 탭 비교용).
        function buildCommentData(commentRows, normalize = true) {
            const data = [];
            const sentimentCounts = { '긍정': 0, '부정': 0, '중립': 0, '오류': 0 };
            const categoryCounts = {};

            commentRows.forEach(row => {
                if (!row.text || !row.sentiment) return;
                if (row.sentiment === '광고' || row.keyword === '광고') return;

                const sentiment = normalizeSentiment(row.sentiment);
                if (!sentiment) return;

                const category = normalize ? normalizeCategory(row.category) : rawCategory(row.category);
                const item = {
                    text: row.text,
                    sentiment,
                    category,
                    keyword: row.keyword || '-'
                };

                data.push(item);
                sentimentCounts[sentiment] += 1;
                if (!categoryCounts[category]) {
                    categoryCounts[category] = { '긍정': 0, '부정': 0, '중립': 0, '오류': 0 };
                }
                categoryCounts[category][sentiment] += 1;
            });

            return { rows: data, sentimentCounts, categoryCounts };
        }

        function buildBundle(report, statsRows, commentRows, overviewRows) {
            const stats = buildStatsSeries(statsRows, report);
            const commentData = buildCommentData(commentRows, false);
            // 종합 탭 비교용: 공통 4분류로 재분석한 파일이 있으면 그 분류를, 없으면 원본을 4분류로 맞춰 씁니다.
            const overviewCategoryCounts = buildCommentData(overviewRows || commentRows, true).categoryCounts;
            const latest = stats[stats.length - 1] || null;
            const totalComments = commentData.rows.length;
            const dominantSentiment = sentimentOrder.reduce((best, key) => {
                return commentData.sentimentCounts[key] > (commentData.sentimentCounts[best] || 0) ? key : best;
            }, '긍정');

            const topCategory = Object.keys(commentData.categoryCounts).sort((a, b) => {
                const sumA = Object.values(commentData.categoryCounts[a]).reduce((acc, value) => acc + value, 0);
                const sumB = Object.values(commentData.categoryCounts[b]).reduce((acc, value) => acc + value, 0);
                return sumB - sumA;
            })[0] || '-';

            return {
                report,
                stats,
                latest,
                comments: commentData.rows,
                sentimentCounts: commentData.sentimentCounts,
                categoryCounts: commentData.categoryCounts,
                overviewCategoryCounts,
                totalComments,
                dominantSentiment,
                topCategory
            };
        }

        async function loadDashboard() {
            try {
                const configResponse = await fetch(`dashboard_config.json?v=${Date.now()}`);
                const config = await configResponse.json();
                const reports = (config.reports || []).filter(report => report.enabled !== false);

                const loadedBundles = await Promise.all(
                    reports.map(async report => {
                        const [statsRows, commentRows, overviewRows] = await Promise.all([
                            parseCsv(`video_stats/video_stats_${report.start_date}.csv`),
                            parseCsv(`analyzed_comments/analyzed_comments_${report.start_date}.csv`),
                            report.overview_comments_file ? parseCsv(report.overview_comments_file).catch(() => null) : null
                        ]);
                        return buildBundle(report, statsRows, commentRows, overviewRows);
                    })
                );

                appState.config = config;
                appState.reports = reports;
                loadedBundles.forEach(bundle => appState.bundles.set(bundle.report.id, bundle));

                document.title = config.dashboard_title || document.title;
                document.getElementById('dashboardTitle').innerText = config.dashboard_title || document.title;

                // 처음에는 종합 탭을 열고, 영상 탭은 가장 최근 등록분이 보이도록 맞춥니다.
                appState.tabOffset = Math.max(0, reports.length - VISIBLE_VIDEO_TABS);
                activateTab('overview');
            } catch (error) {
                console.error(error);
                document.getElementById('overviewSection').innerHTML = `
                    <div class="card-panel">
                        <div class="panel-body">
                            <div class="fw-bold text-danger mb-2">대시보드 데이터를 불러오지 못했습니다.</div>
                            <div class="text-muted">dashboard_config.json 또는 CSV 파일 경로를 확인해 주세요.</div>
                        </div>
                    </div>
                `;
            }
        }

        function renderTabs() {
            const reports = appState.reports;
            const visibleCount = VISIBLE_VIDEO_TABS;
            const maxOffset = Math.max(0, reports.length - visibleCount);
            appState.tabOffset = Math.min(Math.max(0, appState.tabOffset), maxOffset);
            const offset = appState.tabOffset;
            const showArrows = reports.length > visibleCount;
            const visibleReports = reports.slice(offset, offset + visibleCount);

            const videoTab = report => `
                <button type="button" class="dashboard-tab video-tab ${appState.activeTab === report.id ? 'active' : ''}" data-tab-id="${escapeHtml(report.id)}" title="${escapeHtml(report.video_title || report.tab_label)}">
                    <span class="tab-name">${safeText(report.tab_label || report.start_date)}</span>
                    <span class="tab-date">${formatShortDate(report.video_start_at)}</span>
                </button>
            `;
            const arrow = (direction, disabled, label, symbol) => `
                <button type="button" class="tab-arrow" data-tab-shift="${direction}" ${disabled ? 'disabled' : ''} aria-label="${label}">${symbol}</button>
            `;

            const container = document.getElementById('tabsContainer');
            container.innerHTML = `
                <button type="button" class="dashboard-tab overview-tab ${appState.activeTab === 'overview' ? 'active' : ''}" data-tab-id="overview">종합</button>
                <div class="tab-scroller">
                    ${showArrows ? arrow(-1, offset === 0, '이전 영상 탭', '‹') : ''}
                    <div class="tab-track">${visibleReports.map(videoTab).join('')}</div>
                    ${showArrows ? arrow(1, offset >= maxOffset, '다음 영상 탭', '›') : ''}
                </div>
            `;

            container.querySelectorAll('[data-tab-id]').forEach(button => {
                button.addEventListener('click', () => activateTab(button.dataset.tabId));
            });
            container.querySelectorAll('[data-tab-shift]').forEach(button => {
                button.addEventListener('click', () => {
                    appState.tabOffset += Number(button.dataset.tabShift);
                    renderTabs();
                });
            });
        }

        function activateTab(tabId) {
            appState.activeTab = tabId;

            const index = appState.reports.findIndex(report => report.id === tabId);
            if (index !== -1) {
                if (index < appState.tabOffset) appState.tabOffset = index;
                if (index >= appState.tabOffset + VISIBLE_VIDEO_TABS) appState.tabOffset = index - VISIBLE_VIDEO_TABS + 1;
            }
            renderTabs();

            const overviewSection = document.getElementById('overviewSection');
            const detailSection = document.getElementById('detailSection');

            if (tabId === 'overview') {
                overviewSection.classList.remove('d-none');
                detailSection.classList.add('d-none');
                renderOverview();
                return;
            }

            overviewSection.classList.add('d-none');
            detailSection.classList.remove('d-none');
            renderDetail(tabId);
        }

        // ---------- 종합 탭 ----------
        const SMALL_SAMPLE = 30;      // 이보다 분석 댓글이 적으면 '표본 적음' 표시
        const MIN_CELL_COUNT = 5;     // 주제별 부정 비중은 이 건수 이상일 때만 표시
        const VIEW_CURVE_DAYS = 30;   // 조회수 추이 비교 구간(게재 후 일수)
        const videoPalette = ['#2563eb', '#f59e0b', '#0d9488', '#7c3aed', '#db2777', '#64748b', '#0891b2', '#a16207'];

        function parseKstTime(value) {
            if (!value) return null;
            const time = new Date(String(value).trim().replace(' ', 'T') + '+09:00').getTime();
            return Number.isFinite(time) ? time : null;
        }

        // 게재 후 N일 시점의 누적 조회수(수집 지점 사이는 선형 보간). 아직 N일이 지나지 않았으면 null.
        const MAX_INTERP_GAP_MS = 2 * 86400000; // 보간 허용 간격(2일)
        function viewsAtDays(bundle, days) {
            const start = parseKstTime(bundle.report.video_start_at);
            if (start === null) return null;
            const target = start + days * 86400000;
            const points = bundle.stats
                .map(row => ({ time: parseKstTime(row.timestamp), views: row.view_count }))
                .filter(point => point.time !== null);
            if (!points.length || points[points.length - 1].time < target) return null;

            const nextIndex = points.findIndex(point => point.time >= target);
            if (nextIndex <= 0) return points[Math.max(0, nextIndex)].time - target <= MAX_INTERP_GAP_MS ? points[Math.max(0, nextIndex)].views : null;
            const prev = points[nextIndex - 1];
            const next = points[nextIndex];
            // 게재 후 한참 뒤에 수집을 시작한 영상은 실측값이 없으므로 추정하지 않습니다.
            if (next.time - prev.time > MAX_INTERP_GAP_MS) return null;
            const ratio = (target - prev.time) / Math.max(1, next.time - prev.time);
            return Math.round(prev.views + (next.views - prev.views) * ratio);
        }

        // 7일 조회수가 없을 때 이유: 아직 7일이 안 됐는지, 게재 후 늦게 수집을 시작했는지.
        function weekViewsNote(bundle) {
            const start = parseKstTime(bundle.report.video_start_at);
            return start !== null && Date.now() - start < 7 * 86400000 ? '7일 미경과' : '수집 전';
        }

        function percent(count, total) {
            return total ? Math.round((count / total) * 100) : 0;
        }

        function renderSentimentBar(bundle) {
            const total = bundle.totalComments;
            const positive = percent(bundle.sentimentCounts['긍정'] || 0, total);
            const negative = percent(bundle.sentimentCounts['부정'] || 0, total);
            const neutral = Math.max(0, 100 - positive - negative);
            return `
                <div class="mini-bar ${total < SMALL_SAMPLE ? 'is-faint' : ''}" title="긍정 ${positive}% · 중립 ${neutral}% · 부정 ${negative}%">
                    <span style="width:${positive}%; background:${colorMap['긍정']}"></span>
                    <span style="width:${neutral}%; background:${colorMap['중립']}"></span>
                    <span style="width:${negative}%; background:${colorMap['부정']}"></span>
                </div>
                <div class="mini-bar-legend"><span class="text-positive">긍정 ${positive}%</span> · <span class="text-negative">부정 ${negative}%</span></div>
            `;
        }

        // '기관 운영 등 기타'는 모든 영상에서 1위라 비교 의미가 없으므로 정책 주제 중 최다 언급을 보여줍니다.
        function renderTopIssue(bundle) {
            const issues = categoryOrder
                .filter(category => category !== '기관 운영 등 기타')
                .map(category => [category, Object.values(bundle.overviewCategoryCounts[category] || {}).reduce((sum, value) => sum + value, 0)])
                .filter(([, count]) => count > 0)
                .sort((a, b) => b[1] - a[1]);
            if (!issues.length) return '<span class="cell-sub">없음</span>';
            const [category, count] = issues[0];
            return `${escapeHtml(category)}<div class="cell-sub">${percent(count, bundle.totalComments)}% · ${formatNumber(count)}건</div>`;
        }

        function renderOverview() {
            const bundles = getOrderedBundles();
            const overviewSection = document.getElementById('overviewSection');

            if (!bundles.length) {
                overviewSection.innerHTML = '<div class="card-panel"><div class="panel-body"><div class="empty-msg">표시할 영상이 없습니다.</div></div></div>';
                return;
            }

            const rows = bundles.map(bundle => {
                const report = bundle.report;
                const views = Number(bundle.latest?.view_count || 0);
                const likes = Number(bundle.latest?.like_count || 0);
                const weekViews = viewsAtDays(bundle, 7);
                const likeRate = views ? `${(likes / views * 100).toFixed(1)}%` : '-';
                return `
                    <tr data-report-id="${escapeHtml(report.id)}">
                        <td>
                            <div class="fw-bold">${safeText(report.tab_label)}</div>
                            <div class="cell-sub">${formatDateOnly(report.video_start_at)}</div>
                        </td>
                        <td class="num">${formatNumber(views)}</td>
                        <td class="num">${weekViews === null ? `<span class="cell-sub">${weekViewsNote(bundle)}</span>` : formatNumber(weekViews)}</td>
                        <td class="num">${likeRate}</td>
                        <td class="num">${formatNumber(bundle.totalComments)}${bundle.totalComments < SMALL_SAMPLE ? '<div class="small-sample">표본 적음</div>' : ''}</td>
                        <td class="sentiment-cell">${renderSentimentBar(bundle)}</td>
                        <td>${renderTopIssue(bundle)}</td>
                    </tr>
                `;
            }).join('');

            overviewSection.innerHTML = `
                <div class="card-panel compare-panel">
                    <div class="panel-header">
                        <h3 class="panel-title">영상별 비교</h3>
                        <p class="panel-subtitle">등록 순서대로 정리했습니다. 행을 누르면 해당 영상 탭으로 이동합니다. 조회수는 게재 시점이 달라 누적값보다 <b>게재 7일 조회수</b>로 비교하는 것이 공정합니다.</p>
                    </div>
                    <div class="table-responsive">
                        <table class="table align-middle mb-0 compare-table">
                            <thead>
                                <tr>
                                    <th>영상</th>
                                    <th class="num">현재 조회수</th>
                                    <th class="num">게재 7일 조회수</th>
                                    <th class="num">좋아요율</th>
                                    <th class="num">분석 댓글</th>
                                    <th>감성 분포</th>
                                    <th>주요 쟁점</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xl-6">
                        <div class="card-panel">
                            <div class="panel-header">
                                <h3 class="panel-title">게재 후 조회수 추이</h3>
                                <p class="panel-subtitle">게재 시점을 0일로 맞춰 초기 확산 속도를 비교합니다(로그 눈금, 최대 ${VIEW_CURVE_DAYS}일).</p>
                            </div>
                            <div class="panel-body">
                                <div id="overviewViewCurveChart" class="chart-container short"><div class="empty-msg">차트 로딩 중...</div></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-6">
                        <div class="card-panel">
                            <div class="panel-header">
                                <h3 class="panel-title">주제별 부정 비중</h3>
                                <p class="panel-subtitle">각 영상에서 주제별 댓글 중 부정 댓글의 비율입니다. 색이 진할수록 부정이 많고, ${MIN_CELL_COUNT}건 미만은 표시하지 않습니다.</p>
                            </div>
                            <div class="panel-body">
                                ${renderNegativeHeatmap(bundles)}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            overviewSection.querySelectorAll('[data-report-id]').forEach(row => {
                row.addEventListener('click', () => activateTab(row.dataset.reportId));
            });

            renderViewCurveChart(bundles);
        }

        function renderNegativeHeatmap(bundles) {
            const categories = categoryOrder;
            const header = categories.map(category => `<th>${escapeHtml(category)}</th>`).join('');
            const body = bundles.map(bundle => {
                const cells = categories.map(category => {
                    const counts = bundle.overviewCategoryCounts[category] || {};
                    const total = Object.values(counts).reduce((sum, value) => sum + value, 0);
                    if (total < MIN_CELL_COUNT) {
                        return `<td class="heat-cell is-empty" title="${total}건">-</td>`;
                    }
                    const share = (counts['부정'] || 0) / total;
                    const textColor = share >= 0.55 ? '#ffffff' : 'var(--text)';
                    return `
                        <td class="heat-cell" style="background: rgba(220, 38, 38, ${(0.08 + share * 0.82).toFixed(2)}); color: ${textColor};" title="부정 ${counts['부정'] || 0}건 / ${total}건">
                            <div class="heat-value">${Math.round(share * 100)}%</div>
                            <div class="heat-count">${total}건</div>
                        </td>
                    `;
                }).join('');
                return `<tr><th class="heat-row-label">${safeText(bundle.report.tab_label)}</th>${cells}</tr>`;
            }).join('');

            return `
                <div class="table-responsive">
                    <table class="heat-table">
                        <thead><tr><th></th>${header}</tr></thead>
                        <tbody>${body}</tbody>
                    </table>
                </div>
            `;
        }

        function renderViewCurveChart(bundles) {
            const container = prepareChartContainer('overviewViewCurveChart');
            if (!container) return;

            const traces = bundles.map((bundle, index) => {
                const start = parseKstTime(bundle.report.video_start_at);
                const points = start === null ? [] : bundle.stats
                    .map(row => ({ day: (parseKstTime(row.timestamp) - start) / 86400000, views: row.view_count }))
                    .filter(point => point.day > 0 && point.day <= VIEW_CURVE_DAYS && point.views > 0);
                return {
                    x: points.map(point => Math.round(point.day * 100) / 100),
                    y: points.map(point => point.views),
                    type: 'scatter',
                    mode: 'lines',
                    name: bundle.report.tab_label || bundle.report.start_date,
                    line: { color: videoPalette[index % videoPalette.length], width: 2.5 },
                    hovertemplate: `${escapeHtml(bundle.report.tab_label)}<br>게재 %{x:.1f}일 후<br>조회수 %{y:,}<extra></extra>`
                };
            }).filter(trace => trace.x.length);

            if (!traces.length) {
                container.innerHTML = '<div class="empty-msg">비교할 조회수 데이터가 없습니다.</div>';
                return;
            }

            Plotly.newPlot('overviewViewCurveChart', traces, {
                margin: { t: 10, b: isMobile ? 96 : 70, l: 56, r: 12 },
                xaxis: { title: isMobile ? '' : '게재 후 경과일', range: [0, VIEW_CURVE_DAYS], tickfont: { size: chartFontSize }, gridcolor: 'rgba(148, 163, 184, 0.22)' },
                yaxis: { type: 'log', tickfont: { size: chartFontSize }, gridcolor: 'rgba(148, 163, 184, 0.22)' },
                legend: { orientation: 'h', y: isMobile ? -0.18 : -0.28, x: 0.5, xanchor: 'center' },
                hovermode: 'closest'
            }, configOptions);
        }

        function renderDetail(reportId) {
            const bundle = appState.bundles.get(reportId);
            if (!bundle) return;

            const report = bundle.report;
            const detailSection = document.getElementById('detailSection');
            const urlHtml = report.video_url
                ? `<a class="video-link" href="${report.video_url}" target="_blank">유튜브 영상 열기</a>`
                : `<span class="text-muted">유튜브 URL 미등록</span>`;

            detailSection.innerHTML = `
                <div class="card-panel">
                    <div class="panel-body">
                        <div class="detail-hero">
                            <div>
                                <div class="badge-soft mb-3">${safeText(report.tab_label)} · ${safeText(report.start_date)}</div>
                                <div class="detail-title">${safeText(report.video_title)}</div>
                                <div class="meta-list">
                                    <div class="meta-line"><strong>영상 게재 시점</strong>${formatDateTime(report.video_start_at)}</div>
                                    <div class="meta-line"><strong>최종 업데이트</strong>${formatDateTime(bundle.latest?.timestamp)}</div>
                                    <div class="meta-line"><strong>링크</strong>${urlHtml}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-6 col-lg-3">${createMetricCard('조회수', formatNumber(bundle.latest?.view_count), '가장 최근 수집 기준')}</div>
                    <div class="col-6 col-lg-3">${createMetricCard('좋아요', formatNumber(bundle.latest?.like_count), '가장 최근 수집 기준')}</div>
                    <div class="col-6 col-lg-3">${createMetricCard('댓글 수', formatNumber(bundle.latest?.comment_count), '유튜브 통계 기준')}</div>
                    <div class="col-6 col-lg-3">${createMetricCard('분석 댓글 수', formatNumber(bundle.totalComments), bundle.totalComments < 10 ? '표본 수가 적습니다.' : '광고 제외 기준')}</div>
                </div>

                <div class="card-panel">
                    <div class="panel-header">
                        <h3 class="panel-title">시간대별 누적 조회수 추이</h3>
                    </div>
                    <div class="panel-body">
                        <div id="detailViewChart" class="chart-container"><div class="empty-msg">차트 로딩 중...</div></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xl-5">
                        <div class="card-panel">
                            <div class="panel-header">
                                <h3 class="panel-title">전체 감성 분포</h3>
                                <p class="panel-subtitle">광고성 댓글을 제외한 감성 분포를 보여줍니다.</p>
                            </div>
                            <div class="panel-body">
                                <div id="detailSentimentChart" class="chart-container short"><div class="empty-msg">차트 로딩 중...</div></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-7">
                        <div class="card-panel">
                            <div class="panel-header">
                                <h3 class="panel-title">분류별 여론</h3>
                                <p class="panel-subtitle">주요 분류별 댓글 반응을 감성 기준으로 나누어 보여줍니다. 차트 아래에서 분류별 대표 긍정·부정 의견을 확인할 수 있습니다.</p>
                            </div>
                            <div class="panel-body">
                                <div id="detailCategoryChart" class="chart-container short"><div class="empty-msg">차트 로딩 중...</div></div>
                                <div id="detailRepComments" class="rep-comments"><div class="empty-msg">대표 댓글 로딩 중...</div></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-panel">
                    <div class="panel-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div>
                            <h3 class="panel-title">전체 분석 데이터</h3>
                        </div>
                        <div class="badge-soft">총 ${formatNumber(bundle.totalComments)}건</div>
                    </div>
                    <div class="table-wrap">
                        <table class="table table-hover align-middle mb-0 detail-data-table" id="detailDataTable">
                            <thead>
                                <tr>
                                    <th class="sortable col-sentiment" data-index="0" style="padding-left: 1.25rem;">감성 <span class="sort-icon">↕</span></th>
                                    <th class="sortable col-category" data-index="1">분류 <span class="sort-icon">↕</span></th>
                                    <th class="sortable col-keyword" data-index="2">키워드 <span class="sort-icon">↕</span></th>
                                    <th>댓글 내용</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${bundle.comments.slice().reverse().map(row => `
                                    <tr>
                                        <td class="col-sentiment" style="padding-left: 1.25rem;"><span class="sentiment-badge ${getSentimentClass(row.sentiment)}">${row.sentiment}</span></td>
                                        <td><span class="badge text-bg-secondary">${safeText(row.category)}</span></td>
                                        <td class="fw-bold">${safeText(row.keyword)}</td>
                                        <td class="small comment-cell">${safeText(row.text)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            renderDetailCharts(bundle);
            renderRepresentativeComments(report);
            attachTableSorting();
        }

        async function renderRepresentativeComments(report) {
            const container = document.getElementById('detailRepComments');
            if (!container) return;

            try {
                const response = await fetch(`representative_comments/representative_comments_${report.start_date}.json?v=${Date.now()}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const categoryEntries = data.categories || {};
                const categories = sortCategories(Object.keys(categoryEntries)).filter(category => {
                    const bucket = categoryEntries[category] || {};
                    return (bucket['긍정'] || []).length || (bucket['부정'] || []).length;
                });

                if (!categories.length) {
                    container.innerHTML = '<div class="empty-msg">표시할 대표 댓글이 없습니다.</div>';
                    return;
                }

                const renderList = (items, icon) => {
                    if (!items || !items.length) return '<div class="rep-empty">해당하는 의견이 없습니다.</div>';
                    return `<ul class="rep-list">${items.map(item => `
                        <li><span class="rep-like">${icon} ${formatNumber(item.like_count)}</span>${safeText(item.text)}</li>
                    `).join('')}</ul>`;
                };

                container.innerHTML = categories.map(category => {
                    const bucket = categoryEntries[category] || {};
                    return `
                        <div class="rep-category">
                            <div class="rep-category-title">${safeText(category)} · 대표 의견</div>
                            <div class="rep-columns">
                                <div><div class="rep-column-title positive">긍정 의견</div>${renderList(bucket['긍정'], '<span class="rep-icon positive">◯</span>')}</div>
                                <div><div class="rep-column-title negative">부정 의견</div>${renderList(bucket['부정'], '❌')}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                container.innerHTML = report.collect_enabled === false
                    ? '<div class="empty-msg">이 영상은 대표 댓글 데이터가 없습니다.</div>'
                    : '<div class="empty-msg">대표 댓글 데이터가 아직 생성되지 않았습니다. 다음 자동 업데이트 후 표시됩니다.</div>';
            }
        }

        // 조회수 기록이 없는 영상: 댓글 작성 시각으로 누적 댓글 수 추이를 그립니다.
        async function renderCommentTimelineChart(bundle) {
            let rows = [];
            try {
                rows = (await parseCsv(bundle.report.comment_timeline_file)).filter(row => row.published_at);
            } catch (error) {
                console.error(error);
            }
            if (appState.activeTab !== bundle.report.id) return;
            const container = document.getElementById('detailViewChart');
            if (!rows.length) {
                if (container) container.innerHTML = '<div class="empty-msg">댓글 작성 시각 데이터가 아직 없습니다.</div>';
                return;
            }
            // 게재 전(예약 공개 등)에 달린 댓글이 있으면 그 시각부터 그립니다.
            const firstAt = rows[0].published_at;
            const start = bundle.report.video_start_at && bundle.report.video_start_at < firstAt ? bundle.report.video_start_at : firstAt;
            const x = [start, ...rows.map(row => row.published_at)];
            const y = [0, ...rows.map((row, index) => index + 1)];
            // 마지막 댓글 이후 오늘(최근 수집 시각)까지 선을 이어 줍니다.
            const lastCollected = bundle.latest?.timestamp;
            if (lastCollected && lastCollected > x[x.length - 1]) {
                x.push(lastCollected);
                y.push(rows.length);
            }
            if (container) container.innerHTML = '';
            Plotly.newPlot('detailViewChart', [{
                x,
                y,
                type: 'scatter',
                mode: 'lines',
                line: { color: '#185ABD', width: 3, shape: 'hv' },
                fill: 'tozeroy',
                fillcolor: 'rgba(24, 90, 189, 0.08)',
                hovertemplate: '%{x}<br>누적 댓글 %{y:,}개<extra></extra>'
            }], {
                margin: { t: 20, b: 50, l: 70, r: 16 },
                xaxis: { tickfont: { size: chartFontSize } },
                yaxis: { tickfont: { size: chartFontSize }, rangemode: 'tozero', title: { text: '누적 댓글 수', font: { size: chartFontSize } } }
            }, configOptions);
        }

        function renderDetailCharts(bundle) {
            prepareChartContainer('detailViewChart');
            prepareChartContainer('detailSentimentChart');
            prepareChartContainer('detailCategoryChart');

            if (bundle.report.comment_timeline_file) {
                renderCommentTimelineChart(bundle);
            } else Plotly.newPlot('detailViewChart', [{
                x: bundle.stats.map(row => row.timestamp),
                y: bundle.stats.map(row => row.view_count),
                type: 'scatter',
                mode: 'lines+markers',
                line: { color: '#185ABD', width: 3, shape: 'spline' },
                fill: 'tozeroy',
                fillcolor: 'rgba(24, 90, 189, 0.08)'
            }], {
                margin: { t: 20, b: 50, l: 58, r: 16 },
                xaxis: { tickfont: { size: chartFontSize } },
                yaxis: { tickfont: { size: chartFontSize } }
            }, configOptions);

            const sentimentValues = sentimentOrder.map(key => bundle.sentimentCounts[key] || 0).filter(value => value > 0);
            const sentimentLabels = sentimentOrder.filter(key => (bundle.sentimentCounts[key] || 0) > 0);

            Plotly.newPlot('detailSentimentChart', [{
                values: sentimentValues.length ? sentimentValues : [1],
                labels: sentimentLabels.length ? sentimentLabels : ['데이터 없음'],
                type: 'pie',
                hole: 0.5,
                marker: { colors: sentimentLabels.map(label => colorMap[label]) },
                sort: false
            }], {
                margin: { t: 20, b: 20, l: 20, r: 20 },
                showlegend: true,
                legend: { orientation: 'h', y: -0.12, x: 0.5, xanchor: 'center', traceorder: 'normal' }
            }, configOptions);

            const categories = Object.keys(bundle.categoryCounts)
                .filter(category => {
                    const total = Object.values(bundle.categoryCounts[category] || {}).reduce((acc, value) => acc + value, 0);
                    return total > 0;
                })
                .sort((a, b) => {
                    const totalA = Object.values(bundle.categoryCounts[a] || {}).reduce((acc, value) => acc + value, 0);
                    const totalB = Object.values(bundle.categoryCounts[b] || {}).reduce((acc, value) => acc + value, 0);
                    if (totalB !== totalA) return totalB - totalA;
                    return sortCategories([a, b])[0] === a ? -1 : 1;
                });

            const traces = sentimentOrder.map(sentiment => ({
                x: categories.map(category => (bundle.categoryCounts[category] || {})[sentiment] || 0),
                y: categories,
                type: 'bar',
                orientation: 'h',
                name: sentiment,
                marker: { color: colorMap[sentiment] }
            }));

            Plotly.newPlot('detailCategoryChart', traces, {
                barmode: 'stack',
                margin: { t: 20, b: 70, l: 110, r: 12 },
                xaxis: { tickfont: { size: chartFontSize } },
                yaxis: { tickfont: { size: chartFontSize }, autorange: 'reversed' },
                legend: { orientation: 'h', y: -0.22, x: 0.5, xanchor: 'center', traceorder: 'normal' }
            }, configOptions);
        }

        function attachTableSorting() {
            document.querySelectorAll('#detailDataTable th.sortable').forEach(header => {
                header.addEventListener('click', () => {
                    const table = header.closest('table');
                    const tableBody = table.querySelector('tbody');
                    const rows = Array.from(tableBody.querySelectorAll('tr'));
                    const index = Number(header.dataset.index);
                    const isAsc = header.classList.contains('asc');

                    rows.sort((rowA, rowB) => {
                        const valueA = rowA.children[index].innerText.trim();
                        const valueB = rowB.children[index].innerText.trim();
                        return isAsc ? valueB.localeCompare(valueA) : valueA.localeCompare(valueB);
                    });

                    table.querySelectorAll('th.sortable').forEach(th => {
                        th.classList.remove('asc', 'desc');
                        th.querySelector('.sort-icon').innerText = '↕';
                    });

                    header.classList.toggle('asc', !isAsc);
                    header.classList.toggle('desc', isAsc);
                    header.querySelector('.sort-icon').innerText = isAsc ? '↑' : '↓';

                    tableBody.innerHTML = '';
                    rows.forEach(row => tableBody.appendChild(row));
                });
            });
        }

        loadDashboard();
    </script>
</body>

</html>
